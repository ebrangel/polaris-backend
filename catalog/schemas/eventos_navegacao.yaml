version: 1
schema: eventos_navegacao

# Teto mais baixo que o dos schemas relacionais, de propósito: aqui cada linha é um
# bucket de uma agregação `composite`, e o adapter já usava 1000 como `size` padrão para
# requisição sem `limit` (`adapters/executors/elasticsearch_dsl.py`). Igualar o teto a
# esse padrão mantém o comportamento de quem não manda `limit` e passa a valer também
# para quem manda um valor alto.
max_limit: 1000

dimensions:
  pais:
    type: string
    filterable: true
  dispositivo:
    type: string
    filterable: true

measures:
  duracao_media:
    agg: avg
  total_eventos:
    agg: value_count

datasets:
  - name: eventos_navegacao_es
    datasource:
      type: elasticsearch
      connection_ref: env:ES_EVENTOS_URL
    provides:
      dimensions: [pais, dispositivo]
      measures: [duracao_media, total_eventos]
    index:
      name: eventos-navegacao
      mapping:
        pais: { field: pais, es_type: keyword }
        dispositivo: { field: dispositivo, es_type: keyword }
        duracao_media: { field: duracao_sessao, agg: avg }
        total_eventos: { field: duracao_sessao, agg: value_count }
