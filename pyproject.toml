[project]
name = "polaris-backend"
version = "0.1.0"
description = "API de consultas analíticas multi-banco"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
