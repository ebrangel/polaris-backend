[project]
name = "polaris-backend"
version = "0.1.0"
description = "API de consultas analíticas multi-banco"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "oracledb>=2.0",
    "elasticsearch[async]>=8.0",
    "arq>=0.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "integration: sobe containers Docker reais (testcontainers) — mais lento",
]
filterwarnings = [
    # O TestClient do Starlette avisa que prefere `httpx2`; trocar de cliente HTTP só
    # por isso não se justifica — o TestClient funciona normalmente com `httpx`.
    # (`StarletteDeprecationWarning` herda de `UserWarning`, não de `DeprecationWarning`.)
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]
